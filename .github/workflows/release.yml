name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build SwissTransfer.zip
        run: ./scripts/build-release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/SwissTransfer.zip \
            --title "SwissTransfer ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
